spring:
  session:
    store-type: redis
    timeout: 2592000
  profiles:
    active: local
  application:
    name: ai-zero-code
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.237.128:3306/aizerocode?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  data:
    redis:
      host: 192.168.237.128
      port: 6379
      ttl: 3600

server:
  port: 8123
  servlet:
